[package]
name = "plaza-kernel"
version = "0.1.0-dp1"
edition = "2021"
description = "Linux kernel management — configuration, module loading, initramfs, patching"

[dependencies]
plaza-foundation = { version = "0.1.0-dp1", path = "../../shared/plaza-foundation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[workspace]
